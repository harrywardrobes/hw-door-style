<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font:12px/1.35 "Segoe UI", Arial, sans-serif; color:#2f4a3f; margin:0; padding:18px 18px; }
  .track { height:14px; border-radius:7px; background:#e4e8e6; overflow:hidden; margin:8px 0 6px; }
  .fill { height:100%; width:0; background:#2f4a3f; transition:width .2s; }
  .count { color:#6a737d; font-size:11px; }
</style>
</head>
<body>
<div id="msg">Starting...</div>
<div class="track"><div class="fill" id="fill"></div></div>
<div class="count" id="count"></div>
<script>
function progress(i, n, msg){
  document.getElementById('msg').textContent = msg;
  document.getElementById('fill').style.width = (n ? Math.round(100 * i / n) : 0) + '%';
  document.getElementById('count').textContent = i + ' of ' + n;
}
</script>
</body>
</html>
