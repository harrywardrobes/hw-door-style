<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Add component</title>
<!--HW-->
<style>
html, body { height:100%; }
body { padding:0; display:flex; flex-direction:column; background:#f6f7f8; }
#top { background:#fff; border-bottom:1px solid var(--line); padding:10px 14px 8px; }
#top .row { display:flex; gap:10px; align-items:center; }
#q { flex:1; font:inherit; font-size:13px; padding:6px 9px; border:1px solid var(--line); border-radius:4px; }
#q:focus { outline:none; border-color:var(--accent); }
#cats { display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; }
.chip { border:1px solid var(--line); background:#fff; border-radius:12px; padding:2px 10px 2px 7px; font-size:11px; cursor:pointer; display:flex; align-items:center; gap:5px; user-select:none; }
.chip i { width:9px; height:9px; border-radius:50%; display:inline-block; }
.chip.on { border-color:var(--accent); background:#eef3f0; font-weight:600; }
.chip b { font-weight:600; color:var(--muted); }
#job { margin-top:7px; font-size:10.5px; color:var(--muted); display:flex; flex-wrap:wrap; gap:3px 12px; }
#job span b { color:var(--ink); font-weight:600; }
#job label { display:flex; gap:4px; align-items:center; color:var(--ink); cursor:pointer; }
#main { flex:1; overflow-y:auto; padding:6px 14px 70px; }
h2 { font-size:12px; margin:14px 0 7px; display:flex; align-items:center; gap:7px; text-transform:uppercase; letter-spacing:.04em; }
h2 i { width:4px; height:15px; border-radius:2px; display:inline-block; }
h2 small { color:var(--muted); font-weight:normal; text-transform:none; letter-spacing:0; }
.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(132px, 1fr)); gap:9px; }
.card { background:#fff; border:1px solid var(--line); border-top:4px solid var(--c); border-radius:5px; cursor:pointer; overflow:hidden; transition:box-shadow .1s, transform .1s; }
.card:hover { box-shadow:0 3px 10px rgba(0,0,0,.12); transform:translateY(-1px); }
.card.on { outline:2px solid var(--c); }
.card .pic { height:108px; background:#fff center/contain no-repeat; display:flex; align-items:center; justify-content:center; }
.card .pic span { font-size:26px; font-weight:700; color:var(--c); opacity:.35; }
.card .nm { padding:5px 8px 6px; border-top:1px solid var(--rule); display:flex; justify-content:space-between; gap:6px; align-items:baseline; }
.card .nm b { font-size:11.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.card .nm small { color:var(--muted); font-size:10px; flex:none; }
#empty { color:var(--muted); text-align:center; margin-top:60px; }
#status { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--line); padding:7px 14px; font-size:11.5px; display:flex; justify-content:space-between; gap:10px; z-index:10; }
#status.warn #st { color:var(--warn); }
#status a { color:var(--accent); cursor:pointer; text-decoration:underline; white-space:nowrap; }
#form { position:fixed; inset:0; background:rgba(30,35,40,.35); display:none; align-items:center; justify-content:center; z-index:20; padding:16px; }
#form.on { display:flex; animation:hwFade .12s ease-out; }
#form .box { background:#fff; border-radius:6px; box-shadow:0 8px 30px rgba(0,0,0,.25); width:100%; max-width:440px; max-height:100%; display:flex; flex-direction:column; border-top:4px solid var(--c, var(--accent)); }
#form h3 { margin:0; padding:12px 16px 4px; font-size:14px; }
#form .sub { padding:0 16px 8px; font-size:11px; color:var(--muted); }
#form .fields { overflow-y:auto; padding:4px 16px 8px; border-top:1px solid var(--rule); }
#form .f { display:grid; grid-template-columns:1fr 150px; gap:10px; align-items:center; padding:5px 0; border-bottom:1px solid var(--rule); font-size:11.5px; }
#form .f.ch label { font-weight:600; }
#form .f input, #form .f select { font:inherit; padding:4px 6px; border:1px solid var(--line); border-radius:3px; width:100%; box-sizing:border-box; }
#form .f input:focus, #form .f select:focus { outline:none; border-color:var(--accent); }
#form .btns { display:flex; justify-content:flex-end; gap:8px; padding:10px 16px; border-top:1px solid var(--line); }
#form button { font:inherit; padding:6px 14px; border-radius:4px; border:1px solid var(--line); background:#fff; cursor:pointer; }
#form button.go { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
@keyframes hwFade { from { opacity:0; } to { opacity:1; } }
</style></head>
<body>
<div id="top">
  <div class="row">
    <input id="q" type="search" placeholder="Search components (Enter places the first)" autocomplete="off">
  </div>
  <div id="cats"></div>
  <div id="job"></div>
</div>
<div id="main"><div id="list"></div><div id="empty" style="display:none"></div></div>
<div id="status"><span id="st">Click a picture to choose its settings, then Place - this window closes so you can click in the model.</span><span><a onclick="sketchup.sync()">Check library</a> &nbsp; <a onclick="sketchup.openFolder()">Open library folder</a></span></div>
<div id="form" onclick="if (event.target === this) closeForm()"><div class="box">
  <h3 id="fTitle"></h3><div class="sub" id="fSub"></div>
  <div class="fields" id="fFields"></div>
  <div class="btns"><button onclick="closeForm()">Cancel</button><button class="go" onclick="placeForm()">Place</button></div>
</div></div>
<script>
var D = /*DATA*/null;
var only = '', picked = null;   // only: the one category shown ('' = all)
try { only = localStorage.getItem('hw_picker_only') || ''; } catch (e) { only = ''; }
function catInfo(c){ var r = D.cats.filter(function(x){ return x[0] === c; })[0]; return r || [c, c, '#6a737d']; }
function initials(l){ return l.split(/[\s-]+/).map(function(w){ return w.charAt(0); }).join('').slice(0, 3); }

function drawCats(){
  var present = {};
  D.cards.forEach(function(c){ present[c.cat] = (present[c.cat] || 0) + 1; });
  var order = D.cats.map(function(x){ return x[0]; });
  Object.keys(present).forEach(function(c){ if (order.indexOf(c) < 0) order.push(c); });
  if (only && !present[only]) only = '';
  $('cats').innerHTML = '<span class="chip' + (only ? '' : ' on') + '" onclick="showCat(\'\')"><i style="background:#c9ced3"></i>All <b>' + D.cards.length + '</b></span>' +
    order.filter(function(c){ return present[c]; }).map(function(c){
      var ci = D.cards.filter(function(x){ return x.cat === c; })[0];
      return '<span class="chip' + (only === c ? ' on' : '') + '" onclick="showCat(\'' + esc(c) + '\')" title="Show only ' + esc(ci.cat_label) + '"><i style="background:' + ci.colour + '"></i>' + esc(ci.cat_label) + ' <b>' + present[c] + '</b></span>';
    }).join('');
}
// Click a category: only that one. Click it again (or All): everything.
function showCat(c){ only = (only === c) ? '' : c; try { localStorage.setItem('hw_picker_only', only); } catch (e) {} drawCats(); draw(); $('main').scrollTop = 0; }

function matches(){
  var q = $('q').value.trim().toLowerCase();
  return D.cards.filter(function(c){
    if (q) return (c.label + ' ' + c.name + ' ' + c.cat_label + ' ' + (c.folder || '')).toLowerCase().indexOf(q) >= 0;   // search looks everywhere
    return !only || c.cat === only;
  });
}
function draw(){
  var list = matches(), html = '', cur = null;
  list.forEach(function(c){
    if (c.cat !== cur) {
      if (cur !== null) html += '</div>';
      cur = c.cat;
      var n = list.filter(function(x){ return x.cat === c.cat; }).length;
      html += '<h2><i style="background:' + c.colour + '"></i>' + esc(c.cat_label) + ' <small>' + n + '</small></h2><div class="grid">';
    }
    html += '<div class="card' + (picked === c.key ? ' on' : '') + '" style="--c:' + c.colour + '" onclick="pick(\'' + esc(c.key) + '\')" title="' + esc(c.name) + (c.ver ? ' V' + c.ver : '') + (c.plain ? ' (placed as it is - not set up to the job)' : '') + '">' +
      '<div class="pic"' + (c.img ? ' style="background-image:url(' + c.img + ')"' : '') + '>' + (c.img ? '' : '<span>' + esc(initials(c.label)) + '</span>') + '</div>' +
      '<div class="nm"><b>' + esc(c.label) + '</b>' + (c.ver ? '<small>V' + c.ver + '</small>' : '') + '</div></div>';
  });
  if (cur !== null) html += '</div>';
  $('list').innerHTML = html;
  var e = $('empty');
  if (!D.cards.length) { e.style.display = ''; e.textContent = 'No components on this computer yet - copying them from the library...'; }
  else if (!list.length) { e.style.display = ''; e.textContent = 'Nothing matches "' + $('q').value + '".'; }
  else e.style.display = 'none';
}
function pick(key){ picked = key; draw(); status({ text: 'Opening its settings...' }); sketchup.form(key); }

// Its settings before it is placed: change any, then Place (Enter) - Esc / Cancel goes back.
var F = null;
function showForm(o){
  F = o;
  var c = D.cards.filter(function(x){ return x.key === o.key; })[0];
  $('form').querySelector('.box').style.setProperty('--c', c ? c.colour : '');
  $('fTitle').textContent = o.label;
  $('fSub').textContent = 'Change any settings, then Place and click in the model. The job (runouts, depth, colours, doors' + (o.ceiling ? ', ceiling ' + o.ceiling + ' mm on Scribed To Ceiling units' : '') + ') is set up after.';
  $('fFields').innerHTML = o.fields.map(function(f, i){
    var input = f.list ? '<select id="ff' + i + '">' + f.options.map(function(op){ return '<option value="' + esc(op[1]) + '"' + (op[1] === f.value ? ' selected' : '') + '>' + esc(op[0]) + '</option>'; }).join('') + '</select>'
                       : '<input id="ff' + i + '" value="' + esc(f.value) + '"' + (f.mm ? ' inputmode="decimal"' : '') + '>';
    return '<div class="f" id="fr' + i + '"><label for="ff' + i + '">' + esc(f.label) + '</label>' + input + '</div>';
  }).join('');
  o.fields.forEach(function(f, i){
    var el = $('ff' + i);
    el.addEventListener(f.list ? 'change' : 'input', function(){ $('fr' + i).className = 'f' + (el.value !== f.value ? ' ch' : ''); });
  });
  $('form').className = 'on';
  status({ text: 'Settings for ' + o.label + ' - Place, then click in the model.' });
  var first = $('ff0'); if (first) first.focus();
}
function closeForm(){ $('form').className = ''; F = null; picked = null; draw(); status({ text: 'Click a picture to choose its settings and place it.' }); $('q').focus(); }
function placeForm(){
  if (!F) return;
  var vals = {};
  F.fields.forEach(function(f, i){ var v = $('ff' + i).value; if (v !== f.value) vals[f.key] = v; });
  var k = F.key; $('form').className = ''; F = null;
  sketchup.place(k, JSON.stringify(vals));
}
document.addEventListener('keydown', function(e){
  if (!F) return;
  if (e.key === 'Escape') { e.preventDefault(); closeForm(); }
  if (e.key === 'Enter') { e.preventDefault(); placeForm(); }
}, true);

function drawJob(){
  var j = D.job || {};
  $('job').innerHTML = '<label><input type="checkbox" id="setup"' + (D.setup ? ' checked' : '') + ' onchange="sketchup.setSetup(this.checked)"> Set up to this job when placed:</label>' +
    '<span>Colours <b>' + esc(j.colours || '-') + '</b></span><span>Doors <b>' + esc(j.doors || '-') + '</b></span>' +
    '<span>Scribes <b>' + esc(j.scribes || '-') + '</b></span><span>Ceiling <b>' + esc(j.ceiling || '-') + '</b></span>';
}
function setJob(j){ D.job = j; drawJob(); }
function setCards(o){
  D.cards = o.cards; drawCats(); draw();
  if (o.note) status({ text: o.note, warn: o.warn });
}
function status(o){ $('st').textContent = o.text; $('status').className = o.warn ? 'warn' : ''; }

$('q').addEventListener('input', draw);
$('q').addEventListener('keydown', function(e){
  if (e.key === 'Enter') { var m = matches()[0]; if (m) pick(m.key); }
  if (e.key === 'Escape' && !F) { $('q').value = ''; draw(); }
});
window.addEventListener('focus', function(){ sketchup.job(); });
drawJob(); drawCats(); draw();
$('q').focus();
sketchup.ready();
</script>
</body></html>
