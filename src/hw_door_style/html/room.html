<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Room setup</title>
<!--HW-->
<style>
html, body { height:100%; }
body { padding:0; display:flex; flex-direction:column; }
#main { flex:1; overflow-y:auto; padding:12px 14px; }
fieldset { border:1px solid var(--line); border-radius:4px; margin:0 0 10px; padding:8px 10px 10px; }
legend { font-weight:600; padding:0 4px; }
.row { display:grid; grid-template-columns:110px 1fr; gap:8px; align-items:center; margin-top:7px; }
.row label { color:var(--ink); }
input[type=text], input[type=number] { font:inherit; width:100%; padding:4px 6px; border:1px solid var(--line); border-radius:3px; }
input:focus { outline:none; border-color:var(--accent); }
.path { font-size:11px; color:var(--muted); word-break:break-all; }
.unit { position:relative; }
.unit input { padding-right:30px; }
.unit span { position:absolute; right:7px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:11px; }
#err { display:none; margin:0 0 10px; padding:7px 10px; border-radius:4px; background:#fbefe8; border:1px solid #efcdb9; color:#7a3412; }
.foot { border-top:1px solid var(--line); padding:9px 14px; display:flex; gap:6px; align-items:center; }
.foot a { font-size:11px; color:var(--muted); cursor:pointer; text-decoration:underline; }
svg { display:block; margin:6px auto 0; }
</style></head>
<body>
<div id="main">
  <h1>Room setup</h1>
  <div class="sub" id="sub"></div>
  <div id="err"></div>

  <fieldset id="saveBox">
    <legend>Save the job</legend>
    <div class="row"><label>Customers folder</label><div><button onclick="sketchup.browse()" id="browseBtn">Choose...</button> <span class="path" id="jobs"></span></div></div>
    <div class="row"><label>Customer folder</label><div><input type="text" id="customer" list="custList" placeholder="Pick one, or type a new name" autocomplete="off"><datalist id="custList"></datalist><div class="hint" id="custHint"></div></div></div>
    <div class="row"><label>File name</label><div class="unit"><input type="text" id="file" autocomplete="off"><span>.skp</span></div></div>
  </fieldset>

  <fieldset>
    <legend>Room size</legend>
    <div class="row"><label>Width</label><div class="unit"><input type="number" id="width" min="0" step="1"><span>mm</span></div></div>
    <div class="row" style="margin-top:2px"><span></span><div class="hint" style="margin:0">Left to right (red axis)</div></div>
    <div class="row"><label>Length</label><div class="unit"><input type="number" id="length" min="0" step="1"><span>mm</span></div></div>
    <div class="row" style="margin-top:2px"><span></span><div class="hint" style="margin:0">Into the room (green axis)</div></div>
    <div class="row"><label>Ceiling height</label><div class="unit"><input type="number" id="ceiling" min="0" step="1"><span>mm</span></div></div>
    <div class="row" style="margin-top:2px"><span></span><div class="hint" style="margin:0">Also the job's ceiling height: Scribed To Ceiling units go to it.</div></div>
    <svg width="220" height="110" viewBox="0 0 220 110" aria-hidden="true">
      <polygon points="30,80 140,80 190,45 80,45" fill="#eef3f0" stroke="#2f4a3f" stroke-width="1.2"/>
      <line x1="30" y1="92" x2="140" y2="92" stroke="#c0392b" stroke-width="1.5"/><text x="85" y="105" font-size="10" text-anchor="middle" fill="#c0392b">width</text>
      <line x1="146" y1="86" x2="196" y2="51" stroke="#2e7d32" stroke-width="1.5"/><text x="186" y="80" font-size="10" fill="#2e7d32">length</text>
      <line x1="22" y1="80" x2="22" y2="10" stroke="#1f5fa8" stroke-width="1.5"/><text x="12" y="48" font-size="10" fill="#1f5fa8" transform="rotate(-90 12 48)" text-anchor="middle">ceiling</text>
    </svg>
  </fieldset>
  <div class="hint" id="partsHint"></div>
</div>
<div class="foot">
  <a onclick="sketchup.never()" title="This file won't ask again (the Scribe / runout window can still set the room)">Don't ask for this file</a>
  <span style="flex:1"></span>
  <button onclick="sketchup.cancel()">Not now</button>
  <button class="primary" id="go" onclick="go()">Set up room</button>
</div>
<script>
var D = /*DATA*/null;
function setJobs(o){
  D.jobs = o.jobs; D.customers = o.customers || [];
  $('jobs').textContent = D.jobs || 'not chosen yet (e.g. 1_CUSTOMERS)';
  $('browseBtn').textContent = D.jobs ? 'Change...' : 'Choose...';
  $('custList').innerHTML = D.customers.map(function(c){ return '<option value="' + esc(c) + '">'; }).join('');
  custHint();
}
function custHint(){
  var v = $('customer').value.trim();
  $('custHint').textContent = !v ? (D.customers.length ? D.customers.length + ' customer folders - newest first' : '')
    : (D.customers.indexOf(v) >= 0 ? 'Saves into the existing folder.' : 'A new folder will be made.');
}
function problem(t){ var e = $('err'); e.textContent = t; e.style.display = 'block'; }
function go(){
  var o = { width: $('width').value, length: $('length').value, ceiling: $('ceiling').value, customer: $('customer').value, file: $('file').value };
  if (!D.saved) {
    if (!D.jobs) return problem('Choose the customers folder first.');
    if (!o.customer.trim()) { $('customer').focus(); return problem('Enter the customer folder.'); }
    if (!o.file.trim()) { $('file').focus(); return problem('Enter the file name.'); }
  }
  if ((D.has_floor || D.has_ceiling) && !(parseFloat(o.width) > 0 && parseFloat(o.length) > 0)) { $('width').focus(); return problem('Enter the room width and length.'); }
  if (!(parseFloat(o.ceiling) > 0)) { $('ceiling').focus(); return problem('Enter the ceiling height.'); }
  sketchup.apply(JSON.stringify(o));
}
$('sub').textContent = D.saved ? D.file + '.skp - set the room size.' : 'New job - where to save it, and the room size.';
$('saveBox').style.display = D.saved ? 'none' : '';
['width', 'length', 'ceiling'].forEach(function(k){ if (D[k]) $(k).value = Math.round(D[k]); });
var missing = [];
if (!D.has_floor) missing.push('floor'); if (!D.has_ceiling) missing.push('ceiling');
$('partsHint').textContent = missing.length === 2 ? 'This file has no floor or ceiling (start new jobs from the Harry Wardrobes template) - only the ceiling height is set.'
  : missing.length ? 'No ' + missing[0] + ' in this file - the rest is sized.' : 'The floor and ceiling are sized to the room; the ceiling sits at the ceiling height.';
$('customer').addEventListener('input', function(){ custHint(); if (!$('file').dataset.touched) $('file').value = $('customer').value; });
$('file').addEventListener('input', function(){ this.dataset.touched = '1'; });
document.addEventListener('keydown', function(e){ if (e.key === 'Enter') go(); });
setJobs(D);
(D.saved ? $('width') : (D.jobs ? $('customer') : $('browseBtn'))).focus();
</script>
</body></html>
