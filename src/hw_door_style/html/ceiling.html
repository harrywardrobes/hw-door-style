<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Ceiling height</title>
<!--HW-->
<style>
  input { font:inherit; padding:4px 6px; border:1px solid #c9ced3; border-radius:3px; width:100%; }
  .err { color:#b4541a; font-size:11px; margin-top:4px; display:none; }
</style>
</head>
<body>
<h1>Ceiling height (mm)</h1>
<div class="sub" id="sub"></div>
<input type="number" id="c" min="0" step="1">
<div class="hint">What is the maximum ceiling height of the wardrobes?</div>
<div class="err" id="err">Enter the ceiling height.</div>
<div class="bar">
  <button onclick="sketchup.cancel()">Cancel</button>
  <button class="primary" onclick="go()">Apply</button>
</div>
<script>
var D = /*DATA*/null;
document.getElementById('sub').textContent = 'Applies to every unit with "Up to ceiling" = TRUE (' + D.count + ' now). Runouts and scribes are not changed.' +
  (D.top_door > 0 ? ' Top doors (TOPBOX, bridge) set to ' + Math.round(D.top_door) + ' mm - Settings > Components.' : '');
document.getElementById('c').value = D.ceiling > 0 ? Math.round(D.ceiling) : 0;
function go(){ var v = parseFloat(document.getElementById('c').value); if (!(v > 0)) { document.getElementById('err').style.display = 'block'; return; } sketchup.apply(String(v)); }
</script>
</body>
</html>
