<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Scribe</title>
<!--HW-->
<style>
  .row { display:grid; grid-template-columns:110px 1fr; align-items:center; gap:8px; padding:5px 0; border-bottom:1px solid #eceef0; }
  .row label { font-weight:600; }
  .row small { color:#b4541a; font-size:10.5px; margin-left:6px; }
  select { font:inherit; padding:3px 4px; border:1px solid #c9ced3; border-radius:3px; width:100%; }
  .hint { color:#6a737d; font-size:10.5px; margin-top:8px; }
</style>
</head>
<body>
<h1 id="title"></h1>
<div class="sub" id="sub"></div>
<div id="ceilRow" class="row" style="display:none"><label>Ceiling height<small id="ceilReq">required</small></label><div><input type="number" id="ceiling" min="0" step="1" style="width:100%;font:inherit;padding:3px 4px;border:1px solid #c9ced3;border-radius:3px"><div class="hint" style="margin-top:3px">What is the maximum ceiling height of the wardrobes? (mm)<span id="topDoor"></span></div></div></div>
<div id="rows"></div>
<div class="hint">Walls, back and "topped off" switches on each component decide what is used. Floor always applies.</div>
<div class="bar">
  <button onclick="sketchup.cancel()">Cancel</button>
  <button class="primary" onclick="apply()">Apply</button>
</div>
<script>
var D = /*DATA*/null;
document.getElementById('title').textContent = D.title;
document.getElementById('sub').textContent = D.selection ? 'Only the selected unit(s). Differences from the job values are flagged in the Summary.' : 'Applies to every unit in the model. Press the pencil again to set all runouts to 0.';
var h = '';
D.sides.forEach(function(s){
  var cur = D.current[s[0]];
  h += '<div class="row"><label>' + esc(s[1].charAt(0).toUpperCase() + s[1].slice(1)) + '</label><div><select id="s_'+s[0]+'">';
  D.values.forEach(function(v){ h += '<option value="'+v+'"'+(Math.abs(v-cur)<0.3?' selected':'')+'>'+Math.round(v)+' mm</option>'; });
  h += '</select>' + (D.selection && Math.abs(cur - D.job[s[0]]) > 0.3 ? '<small>job: '+Math.round(D.job[s[0]])+' mm</small>' : '') + '</div></div>';
});
document.getElementById('rows').innerHTML = h;
if (D.ceiling !== null && D.ceiling !== undefined) {
  document.getElementById('ceilRow').style.display = '';
  document.getElementById('ceiling').value = D.ceiling > 0 ? Math.round(D.ceiling) : 0;
  if (D.top_door > 0) document.getElementById('topDoor').textContent = ' Top doors ' + Math.round(D.top_door) + ' mm (Settings > Components).';
}
function apply(){ var o = {};
  if (D.ceiling !== null && D.ceiling !== undefined) {
    var c = parseFloat(document.getElementById('ceiling').value);
    if (!(c > 0)) { var r = document.getElementById('ceilReq'); r.textContent = 'required - enter the ceiling height'; document.getElementById('ceiling').focus(); return; }
    o.ceiling = c;
  } D.sides.forEach(function(s){ o[s[0]] = parseFloat(document.getElementById('s_'+s[0]).value); }); sketchup.apply(JSON.stringify(o)); }
</script>
</body>
</html>
