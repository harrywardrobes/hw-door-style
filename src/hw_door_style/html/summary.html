<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Door summary</title>
<!--HW-->
<style>
  :root { --ink:#1f2328; --muted:#6a737d; --line:#d8dce0; --head:#f3f4f6; --accent:#2f4a3f; }
  body { font:13px/1.4 "Segoe UI", Arial, sans-serif; color:var(--ink); margin:0; padding:16px 20px; background:#fff; }
  header { display:flex; justify-content:space-between; align-items:flex-end; border-bottom:2px solid var(--accent); padding-bottom:8px; margin-bottom:12px; }
  h1 { font-size:18px; margin:0; }
  .meta { color:var(--muted); font-size:12px; }
  .bar { display:flex; gap:8px; margin-bottom:12px; }
  button { font:inherit; padding:6px 12px; border:1px solid var(--line); border-radius:4px; background:#fff; cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .totals { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:10px; margin-bottom:14px; }
  .card { border:1px solid var(--line); border-radius:4px; padding:8px 10px; }
  .card h2 { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:0 0 4px; }
  .card div { display:flex; justify-content:space-between; }
  table { border-collapse:collapse; width:100%; }
  th, td { border-bottom:1px solid var(--line); padding:4px 6px; text-align:left; vertical-align:top; }
  th { background:var(--head); font-weight:600; position:sticky; top:0; }
  td.num, th.num { text-align:right; }
  tr.warn td { background:#fff6e5; }
  .empty { color:var(--muted); padding:20px 0; }
  @media print {
    .bar { display:none; }
    body { padding:0; }
    th { position:static; }
    tr { page-break-inside:avoid; }
  }
</style>
</head>
<body>
<header>
  <div><h1>Harry Wardrobes - Door &amp; drawer front summary</h1>
  <div class="meta" id="meta"></div></div>
  <div class="meta" id="ver"></div>
</header>
<div class="bar">
  <button onclick="sketchup.refresh()">Refresh</button>
  <button class="primary" onclick="sketchup.exportOrder()">Export door order (CSV + PDF)</button>
  <span class="meta" id="last" style="align-self:center"></span>
</div>
<div id="runouts"></div>
<div class="totals" id="totals"></div>
<div id="table"></div>
<script>
function card(title, obj){
  var keys = Object.keys(obj); if(!keys.length) return '';
  return '<div class="card"><h2>'+esc(title)+'</h2>'+keys.map(function(k){return '<div><span>'+esc(k)+'</span><b>'+esc(obj[k])+'</b></div>';}).join('')+'</div>';
}
function render(d){
  document.getElementById('meta').textContent = (d.job||'Unsaved model')+'  |  Hinge type: '+d.hinge_type+'  |  '+d.date;
  document.getElementById('ver').textContent = 'HW Door Style v'+d.version;
  document.getElementById('last').textContent = d.last_export ? ('Last export: v'+d.last_export) : 'Not exported yet';
  var ro = d.runouts || {};
  var rh = '';
  if (ro.on === false) rh += '<div class="card" style="border-color:#efcdb9;background:#fbefe8;margin-bottom:10px"><b>Scribes are OFF</b> - every runout is 0. Press the pencil before ordering or cutting.</div>';
  if (ro.changed && ro.changed.length) rh += '<div class="card" style="border-color:#f0d79a;background:#fff8e6;margin-bottom:10px"><h2>Runouts changed by hand ('+ro.changed.length+')</h2>' + ro.changed.map(function(c){ return '<div><span>'+esc(c[0])+'</span><b>'+esc(c[1].join(', '))+'</b></div>'; }).join('') + '</div>';
  document.getElementById('runouts').innerHTML = rh;
  var t = d.totals;
  var extra = {}; extra['Items'] = t.items; extra['TIP-ON'] = t.tip_on; extra['Handles / knobs'] = t.handles;
  document.getElementById('totals').innerHTML = card('Items by style', t.by_style) + card('Hinges', t.hinges) + card('Totals', extra);
  if(!d.rows.length){ document.getElementById('table').innerHTML = '<div class="empty">No doors or drawer fronts found. Check the names in Settings.</div>'; return; }
  var h = '<table><thead><tr><th class="num">#</th><th>Unit</th><th>Item</th><th>Kind</th><th class="num">W</th><th class="num">H</th><th>Style</th><th>Mid-rail</th><th>Hinge type</th><th class="num">Hinges</th><th class="num">TIP-ON</th><th class="num">Handles</th><th>Notes</th></tr></thead><tbody>';
  d.rows.forEach(function(r){
    h += '<tr'+(r.notes?' class="warn"':'')+'><td class="num">'+r.n+'</td><td>'+esc(r.unit)+'</td><td>'+esc(r.item)+'</td><td>'+esc(r.kind)+'</td><td class="num">'+esc(r.width)+'</td><td class="num">'+esc(r.height)+'</td><td>'+esc(r.style)+'</td><td>'+esc(r.midrail)+'</td><td>'+esc(r.hinge_type)+'</td><td class="num">'+(r.hinges||'')+'</td><td class="num">'+(r.tip_on||'')+'</td><td class="num">'+(r.handles||'')+'</td><td>'+esc(r.notes)+'</td></tr>';
  });
  document.getElementById('table').innerHTML = h + '</tbody></table>';
}
render(/*DATA*/null);
</script>
</body>
</html>
